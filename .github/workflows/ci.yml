name: ci

on:
  push:
  pull_request:

jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: The generated files are up to date
        run: |
          npx tree-sitter generate --abi 14
          git diff --exit-code -- src
      - run: npx tree-sitter test
